name: med_reminder
description: "Medicine Reminder"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2

  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.3
  google_mobile_ads: ^5.3.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/medicines_db.json
